"$schema" = 'https://starship.rs/config-schema.json'

format = """
(fg:color_fg0)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$php\
$java\
$kotlin\
$python\
$nodejs\
$time\
$character"""

palette = 'tokyo_night'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[palettes.tokyo_night]
color_fg0 = '#c0caf5'
color_fg1 = '#c0caf5'
color_fg2 = '#a9b1d6'
color_fg3 = '#737aa2'
color_fg4 = '#565f89'
color_fg5 = '#545c7e'

color_bg0 = '#16161e'
color_bg1 = '#1a1b26'
color_bg2 = '#1f2335'
color_bg3 = '#24283b'
color_bg4 = '#292e42'
color_bg5 = '#3b4261'
color_bg6 = '#414868'
color_darkblue='#3d59a1'
color_lightblue='#7dcfff'
color_blue = '#2ac3de'
color_blue1='#7aa2f7'
color_aqua = '#73daca'
color_green = '#9ece6a'
color_orange = '#ff9e64'
color_purple = '#bb9af7'
color_red = '#f7768e'
color_yellow = '#e0af68'


[os]
disabled = false
style = "bg:none fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:none fg:color_fg0"
style_root = "bg:none fg:color_fg0"
format = '[ ]($style)'

[directory]
style = "bg:none fg:color_blue"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:none fg:color_green"
format = '[[$symbol $branch ](fg:color_green)]($style)'

[git_status]
style = "fg:color_yellow"
format = '[[($all_status$ahead_behind )](fg:color_yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[$symbol( $version) ]( fg:color_aqua)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[$symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[$symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[$symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "fg:color_purple"
format = '[[$symbol( $version) ](fg:color_purple)]($style)'

[java]
symbol = " "
style = "fg:color_lightblue"
format = '[[$symbol( $version) ](fg:color_lightblue)]($style)'

[kotlin]
symbol = ""
style = "fg:color_orange"
format = '[[$symbol( $version) ](fg:color_orange)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[$symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
# style = "fg:color_blue"
style = "color_darkblue"
pyenv_version_name = true
format = '[[$symbol( $version) ](fg:color_blue1)( \($virtualenv\))]($style)'
# format = 'via [${symbol} (${version} )(\($virtualenv\) )]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[$symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%T"
style = "bg:color_bg1"
format = '[[$time ](fg:color_fg4 bg:color_bg1)]($style)'
#format = '[[ $time ](fg:color_fg5 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
